<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>500 — सर्वर त्रुटि | छःन्यात राजस्थानी विप्र मंडल</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --maroon: #7B1A1A; --gold: #C9941A; --cream: #FDF6EC;
      --text-dark: #2A1A0E; --text-mid: #5C3D1E;
    }
    body {
      min-height: 100vh; background: var(--cream);
      font-family: 'Noto Sans Devanagari', Georgia, serif;
      color: var(--text-dark);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 20px; text-align: center;
    }
    .error-code {
      font-size: clamp(5rem, 20vw, 9rem); font-weight: 700;
      color: var(--maroon); line-height: 1; letter-spacing: -4px;
      text-shadow: 2px 4px 0 rgba(123,26,26,.15);
    }
    .divider {
      width: 80px; height: 3px; margin: 18px auto;
      background: linear-gradient(90deg, var(--maroon), var(--gold));
      border-radius: 2px;
    }
    h1 { font-size: 1.6rem; color: var(--maroon); margin-bottom: 10px; }
    p  { color: var(--text-mid); font-size: 1rem; max-width: 420px; line-height: 1.6; margin-bottom: 30px; }
    a.btn {
      display: inline-block; padding: 12px 28px;
      background: var(--maroon); color: #fff;
      border-radius: 6px; text-decoration: none;
      font-size: 0.95rem; transition: background .2s;
    }
    a.btn:hover { background: #9b2222; }
    .om { font-size: 2.5rem; margin-bottom: 10px; color: var(--gold); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="om">ॐ</div>
  <div class="error-code">500</div>
  <div class="divider"></div>
  <h1>आंतरिक सर्वर त्रुटि</h1>
  <p>सर्वर पर कुछ समस्या आई है। कृपया थोड़ी देर बाद पुनः प्रयास करें।</p>
  <a class="btn" href="/">🏠 मुखपृष्ठ पर जाएं</a>
</body>
</html>
